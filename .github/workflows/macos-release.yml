name: macOS Apple Silicon release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build from and receive the macOS package
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: macos-release-${{ github.event.release.tag_name || inputs.release_tag || github.ref }}
  cancel-in-progress: true

jobs:
  build-macos-apple-silicon:
    if: ${{ github.event_name != 'release' || !contains(github.event.release.body, '[skip-desktop]') }}
    runs-on: macos-14
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.ref }}
          fetch-depth: 0

      - name: Require Apple Silicon runner
        run: test "$(uname -m)" = "arm64"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: potatoflow-app/requirements.lock

      - name: Validate release tag and version
        id: release_meta
        env:
          TARGET_RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          version="$(python -c "import sys; sys.path.insert(0, 'potatoflow-app'); from version import __version__; print(__version__)")"
          release_tag="${TARGET_RELEASE_TAG:-}"
          if [[ -n "$release_tag" ]]; then
            [[ "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]
            [[ "$release_tag" = "v$version" ]]
            [[ "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$release_tag^{commit}")" ]]
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "dmg=PotatoFlow-v$version-macOS-Apple-Silicon.dmg" >> "$GITHUB_OUTPUT"

      - name: Install build and application dependencies
        run: |
          brew install ffmpeg
          python -m pip install --upgrade pip
          python -m pip install torch==2.6.0 torchaudio==2.6.0
          python -m pip install -r potatoflow-app/requirements.lock pyinstaller==6.15.0

      - name: Build recorder core
        working-directory: recorder-core
        run: cargo build --release -p biliup-cli

      - name: Run all test suites before packaging
        env:
          POTATO_PYTHON: python
        run: bash ops/test-all.sh

      - name: Build ad-hoc signed app and DMG
        working-directory: potatoflow-app
        run: python build-tools/build_macos.py

      - name: Validate packaged assets
        shell: bash
        working-directory: potatoflow-app
        env:
          VERSION: ${{ steps.release_meta.outputs.version }}
        run: |
          set -euo pipefail
          app="build-tools/dist-macos/PotatoFlow.app"
          executable="$app/Contents/MacOS/PotatoFlow"
          dmg="build-tools/dist-macos/PotatoFlow-v$VERSION-macOS-Apple-Silicon.dmg"
          test -x "$executable"
          file "$executable" | grep -q 'arm64'
          codesign --verify --deep --strict "$app"
          "$executable" --check-desktop-assets
          test -s "$dmg"
          (cd "$(dirname "$dmg")" && shasum -a 256 -c "$(basename "$dmg.sha256")")

      - name: Smoke test packaged server mode
        shell: bash
        working-directory: potatoflow-app
        env:
          VERSION: ${{ steps.release_meta.outputs.version }}
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/potatoflow-home"
          export PORT=5018
          mkdir -p "$HOME"
          executable="build-tools/dist-macos/PotatoFlow.app/Contents/MacOS/PotatoFlow"
          "$executable" --server-only > "$RUNNER_TEMP/potatoflow-macos-smoke.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          healthy=0
          for _ in $(seq 1 90); do
            if ! kill -0 "$pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/potatoflow-macos-smoke.log"
              exit 1
            fi
            if curl -fsS "http://127.0.0.1:$PORT/healthz" | python -c "import json,sys; data=json.load(sys.stdin); assert data['status']=='ok' and data['version']=='$VERSION'"; then
              healthy=1
              break
            fi
            sleep 2
          done
          test "$healthy" = 1
          test -f "$HOME/Library/Application Support/PotatoFlow/config/config.json"

      - name: Upload macOS assets to Release
        if: steps.release_meta.outputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_meta.outputs.release_tag }}
          DMG: ${{ steps.release_meta.outputs.dmg }}
        working-directory: potatoflow-app/build-tools/dist-macos
        run: gh release upload "$RELEASE_TAG" "$DMG" "$DMG.sha256" --clobber

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PotatoFlow-v${{ steps.release_meta.outputs.version }}-macOS-Apple-Silicon
          path: |
            potatoflow-app/build-tools/dist-macos/${{ steps.release_meta.outputs.dmg }}
            potatoflow-app/build-tools/dist-macos/${{ steps.release_meta.outputs.dmg }}.sha256
          if-no-files-found: error
