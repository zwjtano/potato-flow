name: Windows installer release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build from and receive the Windows installer
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.event.release.tag_name || inputs.release_tag || github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-installer:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: potatoflow-app/requirements.lock

      - name: Read release metadata
        id: release_meta
        shell: pwsh
        env:
          TARGET_RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = python -c "import sys; sys.path.insert(0, 'potatoflow-app'); from version import __version__; print(__version__)"
          $releaseTag = "$env:TARGET_RELEASE_TAG".Trim()
          if ($releaseTag) {
            if ($releaseTag -notmatch '^v\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$') {
              throw "Invalid release tag format: $releaseTag"
            }
            $expectedTag = "v$version"
            if ($releaseTag -ne $expectedTag) {
              throw "Release tag $releaseTag does not match source version $version (expected $expectedTag)."
            }
            $headCommit = (git rev-parse HEAD).Trim()
            $tagCommit = (git rev-parse --verify "refs/tags/$releaseTag^{commit}").Trim()
            if ($headCommit -ne $tagCommit) {
              throw "Checked-out commit $headCommit does not match $releaseTag commit $tagCommit."
            }
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "release_tag=$releaseTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "installer=PotatoFlow-v$version-Windows-x64-Setup.exe" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "portable=PotatoFlow-v$version-Windows-x64-Portable.zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Validate existing Release assets
        if: steps.release_meta.outputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_meta.outputs.release_tag }}
          RELEASE_VERSION: ${{ steps.release_meta.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $allowed = @(
            "PotatoFlow-v$env:RELEASE_VERSION-Windows-x64-Setup.exe",
            "PotatoFlow-v$env:RELEASE_VERSION-Windows-x64-Setup.exe.sha256",
            "PotatoFlow-v$env:RELEASE_VERSION-Windows-x64-Portable.zip",
            "PotatoFlow-v$env:RELEASE_VERSION-Windows-x64-Portable.zip.sha256"
          )
          $assetNames = @(gh release view $env:RELEASE_TAG --json assets --jq '.assets[].name')
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to inspect existing assets for Release $env:RELEASE_TAG."
          }
          $windowsAssets = @($assetNames | Where-Object {
            $_ -match '^PotatoFlow-v.+-Windows-x64-(?:Setup\.exe|Portable\.zip)(?:\.sha256)?$'
          })
          $unexpected = @($windowsAssets | Where-Object { $_ -notin $allowed })
          if ($unexpected.Count -gt 0) {
            throw "Release $env:RELEASE_TAG contains Windows assets for another version: $($unexpected -join ', ')"
          }

      - name: Set up Rust MSVC
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install application and build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r potatoflow-app/requirements.lock pyinstaller==6.15.0

      - name: Run all test suites before packaging
        shell: pwsh
        run: ./ops/test-all.ps1

      - name: Build Windows desktop installer
        working-directory: potatoflow-app
        run: python build-tools/build_exe.py

      - name: Smoke test packaged server mode
        shell: pwsh
        working-directory: potatoflow-app
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = Join-Path $PWD 'build-tools/dist/PotatoFlow'
          $exe = Join-Path $bundle 'PotatoFlow.exe'
          $env:LOCALAPPDATA = Join-Path $PWD 'build-tools/smoke-localappdata'
          $process = Start-Process -FilePath $exe -ArgumentList '--server-only' -WorkingDirectory $bundle -PassThru -WindowStyle Hidden
          try {
            $healthy = $false
            for ($attempt = 0; $attempt -lt 90; $attempt++) {
              Start-Sleep -Seconds 2
              if ($process.HasExited) { throw "PotatoFlow.exe exited with code $($process.ExitCode)" }
              try {
                $health = Invoke-RestMethod -Uri 'http://127.0.0.1:5001/healthz' -TimeoutSec 3
                if ($health.status -eq 'ok' -and $health.version -eq '${{ steps.release_meta.outputs.version }}') {
                  $healthy = $true
                  break
                }
              } catch { Write-Host "Waiting for health endpoint ($($attempt + 1)/90)..." }
            }
            if (-not $healthy) { throw 'Packaged server mode did not become healthy.' }
            $config = Join-Path $env:LOCALAPPDATA 'PotatoFlow/config/config.json'
            if (-not (Test-Path $config)) { throw "Installed data root was not used: $config" }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      - name: Smoke test packaged desktop assets
        shell: pwsh
        working-directory: potatoflow-app
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD 'build-tools/dist/PotatoFlow/PotatoFlow.exe'
          $process = Start-Process -FilePath $exe -ArgumentList '--check-desktop-assets' -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Desktop asset check exited with $($process.ExitCode)" }

      - name: Silent install and uninstall smoke test
        shell: pwsh
        working-directory: potatoflow-app
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $PWD 'build-tools/dist'
          $setup = Join-Path $dist '${{ steps.release_meta.outputs.installer }}'
          $installDir = Join-Path $PWD 'build-tools/installed/PotatoFlow'
          if (-not (Test-Path $setup)) { throw "Missing installer: $setup" }
          $install = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$installDir" -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw "Installer exited with $($install.ExitCode)" }
          $installedExe = Join-Path $installDir 'PotatoFlow.exe'
          if (-not (Test-Path $installedExe)) { throw 'Installed executable is missing.' }
          $dataRoot = Join-Path $env:LOCALAPPDATA 'PotatoFlow'
          New-Item -ItemType Directory -Path $dataRoot -Force | Out-Null
          $sentinel = Join-Path $dataRoot 'uninstall-preserves-user-data.txt'
          Set-Content -Path $sentinel -Value 'keep' -Encoding ascii
          $process = Start-Process -FilePath $installedExe -ArgumentList '--server-only' -WorkingDirectory $installDir -PassThru -WindowStyle Hidden
          try {
            $healthy = $false
            for ($attempt = 0; $attempt -lt 90; $attempt++) {
              Start-Sleep -Seconds 2
              if ($process.HasExited) { throw "Installed PotatoFlow.exe exited with code $($process.ExitCode)" }
              try {
                $health = Invoke-RestMethod -Uri 'http://127.0.0.1:5001/healthz' -TimeoutSec 3
                if ($health.status -eq 'ok' -and $health.version -eq '${{ steps.release_meta.outputs.version }}') {
                  $healthy = $true
                  break
                }
              } catch { Write-Host "Waiting for installed health endpoint ($($attempt + 1)/90)..." }
            }
            if (-not $healthy) { throw 'Installed server mode did not become healthy.' }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
          $uninstaller = Join-Path $installDir 'unins000.exe'
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru -Wait
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller exited with $($uninstall.ExitCode)" }
          if (-not (Test-Path $sentinel)) { throw 'Uninstall unexpectedly removed user data.' }

      - name: Verify installer checksum
        shell: pwsh
        working-directory: potatoflow-app
        run: |
          $dist = Join-Path $PWD 'build-tools/dist'
          $installerName = '${{ steps.release_meta.outputs.installer }}'
          $installer = Join-Path $dist $installerName
          $checksum = (Get-Content "$installer.sha256" -Raw).Trim().Split(' ')[0]
          $actual = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($checksum -ne $actual) { throw 'Installer SHA-256 mismatch.' }
          $portableName = '${{ steps.release_meta.outputs.portable }}'
          $portable = Join-Path $dist $portableName
          $portableChecksum = (Get-Content "$portable.sha256" -Raw).Trim().Split(' ')[0]
          $portableActual = (Get-FileHash $portable -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($portableChecksum -ne $portableActual) { throw 'Portable SHA-256 mismatch.' }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PotatoFlow-v${{ steps.release_meta.outputs.version }}-Windows-x64-Setup
          path: |
            potatoflow-app/build-tools/dist/${{ steps.release_meta.outputs.installer }}
            potatoflow-app/build-tools/dist/${{ steps.release_meta.outputs.installer }}.sha256
            potatoflow-app/build-tools/dist/${{ steps.release_meta.outputs.portable }}
            potatoflow-app/build-tools/dist/${{ steps.release_meta.outputs.portable }}.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload installer to GitHub Release
        if: steps.release_meta.outputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_meta.outputs.release_tag }}
        run: |
          gh release upload $env:RELEASE_TAG `
            potatoflow-app/build-tools/dist/${{ steps.release_meta.outputs.installer }} `
            potatoflow-app/build-tools/dist/${{ steps.release_meta.outputs.installer }}.sha256 `
            potatoflow-app/build-tools/dist/${{ steps.release_meta.outputs.portable }} `
            potatoflow-app/build-tools/dist/${{ steps.release_meta.outputs.portable }}.sha256 `
            --clobber
