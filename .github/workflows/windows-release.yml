name: Windows installer release

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/windows-release.yml
      - danmaku_pipeline.py
      - bridge.py
      - bridge.config.example.json
      - y2a-auto/**
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to receive the Windows installer
        required: false
        type: string
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-installer:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: y2a-auto/requirements.lock

      - name: Read release metadata
        id: release_meta
        shell: pwsh
        run: |
          $version = python -c "import sys; sys.path.insert(0, 'y2a-auto'); from version import __version__; print(__version__)"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "installer=PotatoFlow-v$version-Windows-x64-Setup.exe" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Install application and build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r y2a-auto/requirements.lock pyinstaller==6.15.0

      - name: Build Windows desktop installer
        working-directory: y2a-auto
        run: python build-tools/build_exe.py

      - name: Smoke test packaged server mode
        shell: pwsh
        working-directory: y2a-auto
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = Join-Path $PWD 'build-tools/dist/PotatoFlow'
          $exe = Join-Path $bundle 'PotatoFlow.exe'
          $env:LOCALAPPDATA = Join-Path $PWD 'build-tools/smoke-localappdata'
          $process = Start-Process -FilePath $exe -ArgumentList '--server-only' -WorkingDirectory $bundle -PassThru -WindowStyle Hidden
          try {
            $healthy = $false
            for ($attempt = 0; $attempt -lt 90; $attempt++) {
              Start-Sleep -Seconds 2
              if ($process.HasExited) { throw "PotatoFlow.exe exited with code $($process.ExitCode)" }
              try {
                $health = Invoke-RestMethod -Uri 'http://127.0.0.1:5001/healthz' -TimeoutSec 3
                if ($health.status -eq 'ok' -and $health.version -eq '${{ steps.release_meta.outputs.version }}') {
                  $healthy = $true
                  break
                }
              } catch { Write-Host "Waiting for health endpoint ($($attempt + 1)/90)..." }
            }
            if (-not $healthy) { throw 'Packaged server mode did not become healthy.' }
            $config = Join-Path $env:LOCALAPPDATA 'PotatoFlow/config/config.json'
            if (-not (Test-Path $config)) { throw "Installed data root was not used: $config" }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      - name: Silent install and uninstall smoke test
        shell: pwsh
        working-directory: y2a-auto
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $PWD 'build-tools/dist'
          $setup = Join-Path $dist '${{ steps.release_meta.outputs.installer }}'
          $installDir = Join-Path $PWD 'build-tools/installed/PotatoFlow'
          if (-not (Test-Path $setup)) { throw "Missing installer: $setup" }
          $install = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$installDir" -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw "Installer exited with $($install.ExitCode)" }
          $installedExe = Join-Path $installDir 'PotatoFlow.exe'
          if (-not (Test-Path $installedExe)) { throw 'Installed executable is missing.' }
          $dataRoot = Join-Path $env:LOCALAPPDATA 'PotatoFlow'
          New-Item -ItemType Directory -Path $dataRoot -Force | Out-Null
          $sentinel = Join-Path $dataRoot 'uninstall-preserves-user-data.txt'
          Set-Content -Path $sentinel -Value 'keep' -Encoding ascii
          $process = Start-Process -FilePath $installedExe -ArgumentList '--server-only' -WorkingDirectory $installDir -PassThru -WindowStyle Hidden
          try {
            $healthy = $false
            for ($attempt = 0; $attempt -lt 90; $attempt++) {
              Start-Sleep -Seconds 2
              if ($process.HasExited) { throw "Installed PotatoFlow.exe exited with code $($process.ExitCode)" }
              try {
                $health = Invoke-RestMethod -Uri 'http://127.0.0.1:5001/healthz' -TimeoutSec 3
                if ($health.status -eq 'ok' -and $health.version -eq '${{ steps.release_meta.outputs.version }}') {
                  $healthy = $true
                  break
                }
              } catch { Write-Host "Waiting for installed health endpoint ($($attempt + 1)/90)..." }
            }
            if (-not $healthy) { throw 'Installed server mode did not become healthy.' }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
          $uninstaller = Join-Path $installDir 'unins000.exe'
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru -Wait
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller exited with $($uninstall.ExitCode)" }
          if (-not (Test-Path $sentinel)) { throw 'Uninstall unexpectedly removed user data.' }

      - name: Verify installer checksum
        shell: pwsh
        working-directory: y2a-auto
        run: |
          $dist = Join-Path $PWD 'build-tools/dist'
          $installerName = '${{ steps.release_meta.outputs.installer }}'
          $installer = Join-Path $dist $installerName
          $checksum = (Get-Content "$installer.sha256" -Raw).Trim().Split(' ')[0]
          $actual = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($checksum -ne $actual) { throw 'Installer SHA-256 mismatch.' }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PotatoFlow-v${{ steps.release_meta.outputs.version }}-Windows-x64-Setup
          path: |
            y2a-auto/build-tools/dist/${{ steps.release_meta.outputs.installer }}
            y2a-auto/build-tools/dist/${{ steps.release_meta.outputs.installer }}.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload installer to GitHub Release
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          gh release upload $env:RELEASE_TAG `
            y2a-auto/build-tools/dist/${{ steps.release_meta.outputs.installer }} `
            y2a-auto/build-tools/dist/${{ steps.release_meta.outputs.installer }}.sha256 `
            --clobber
