name: Application

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: application-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: y2a-auto/requirements.lock

      - name: Install CPU media and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install --upgrade pip
          python -m pip install \
            "torch==2.6.0" "torchaudio==2.6.0" \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r y2a-auto/requirements.lock

      - name: Run all test suites
        env:
          POTATO_PYTHON: python
        run: bash scripts/test-all.sh

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: potato-flow:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
